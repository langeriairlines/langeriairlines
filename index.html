<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANGERI AIRLINES a.s.</title>
    <style>
        /* Základní reset a nastavení celé stránky */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #161920; /* Elegantní tmavě šedo-modrá barva ladící k noční obloze */
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }

        /* Záhlaví (Hero banner) */
        .hero-header {
            width: 100%;
            height: 500px; /* Výška záhlaví na počítači */
            background-image: url('header-bg.jpg'); /* Opraveno na malé h */
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            
            /* Zlatá oddělovací linka dole */
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
        }

        /* Hlavní prostor pro obsah webu */
        .main-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        h1 {
            color: #d4af37;
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        /* Úprava výšky záhlaví pro mobilní telefony, aby se obrázek neořezával */
        @media (max-width: 768px) {
            .hero-header {
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <!-- Horní banner s tvou grafikou a zlatou linkou -->
    <header class="hero-header"></header>

    <!-- Hlavní textová část pod čárou -->
    <main class="main-content">
        <h1>Vítejte na palubě LANGERI AIRLINES a.s.</h1>
        <p>Zde můžeš začít psát texty o vaší letecké společnosti, představit flotilu, destinace nebo rezervační informace.</p>
    </main>

</body>
</html>
